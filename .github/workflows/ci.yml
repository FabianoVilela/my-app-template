name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Reads the pnpm version from packageManager in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Expo SDK dependency versions
        run: pnpm expo install --check

      - name: Lint, formatting and imports
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      - name: Check i18n catalog types
        run: pnpm i18n:check

      - name: Application tests
        run: pnpm test:ci

      - name: App variant tests
        run: pnpm test:variants

      - name: Release version tests
        run: pnpm test:release-version

      - name: Rename script tests
        run: pnpm test:rename-app

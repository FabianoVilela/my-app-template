allowBuilds:
  # Optional native accelerators have platform packages/fallbacks; no scripts needed.
  '@parcel/watcher': false
  unrs-resolver: false
  # Sentry CLI installs/verifies the platform binary used for source maps.
  '@sentry/cli': true
  # Firebase web auto-init config (App Hosting) and a protobufjs version warning;
  # React Native Firebase uses the native SDKs and needs neither.
  '@firebase/util': false
  protobufjs: false
